name: Build Between

# Builds the Mac app on every push, and publishes a downloadable release when you push a version tag
# (for example: git tag v0.2 && git push origin v0.2). You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the app (Apple Silicon + Intel)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION="0.1"; fi
          chmod +x build.sh
          UNIVERSAL=1 VERSION="$VERSION" ./build.sh
          lipo -info Between.app/Contents/MacOS/Between

      - name: Keep the build for download from this run
        uses: actions/upload-artifact@v4
        with:
          name: Between
          path: Between.zip

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Between.zip
          body: |
            **Install:** download Between.zip below, double-click it, and drag Between into Applications.

            **First open:** macOS will say it can't check the app for malicious software, because it isn't signed with an Apple developer account yet. Click Done, then go to System Settings → Privacy & Security, scroll down, and click **Open Anyway**. You only do this once.

            Look for the wheel icon in your menu bar.
