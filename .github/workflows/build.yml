name: Build Between

# Every push to main builds the Mac app (Apple Silicon + Intel) and publishes it as the release
# named after the VERSION file (v0.1, v0.2, ...). Same version again = that release's download is
# replaced; bump VERSION for a new release. You can also run it by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build the app (Apple Silicon + Intel)
        run: |
          chmod +x build.sh
          UNIVERSAL=1 VERSION="${{ steps.version.outputs.version }}" ./build.sh
          lipo -info Between.app/Contents/MacOS/Between

      - name: Keep the build for download from this run
        uses: actions/upload-artifact@v4
        with:
          name: Between
          path: Between.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Between ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Between.zip
          body: |
            **Install:** download Between.zip below, double-click it, and drag Between into Applications.

            **First open:** macOS will say it can't check the app for malicious software, because it isn't signed with an Apple developer account yet. Click Done, then go to System Settings → Privacy & Security, scroll down, and click **Open Anyway**. You only do this once.

            Look for the wheel icon in your menu bar.
